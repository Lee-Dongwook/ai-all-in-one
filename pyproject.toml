[project]
name = "ai-all-in-one"
version = "0.1.0"
description = "AI All In One"
authors = [
    {name = "Lee-Dongwook", email = "dlehddnr0713@gmail.com"}
]
readme = "README.md"
requires-python = ">=3.13,<4.0"
dependencies = [
    "cryptography>=46.0.0",
    "fastapi>=0.142.4",
    "jwt>=1.4.0",
    "langchain>=1.4.3",
    "langchain-core>=1.6.7",
    "langgraph>=1.2.14",
    "pydantic>=2.13.5",
    "pydantic-settings>=2.15.0",
    "pyyaml>=6.0.3",
    "scalar-fastapi>=1.9.1",
    "starlette>=1.7.0",
    "uvicorn>=0.54.0",
]

[build-system]
requires = ["hatchling>=1.27.0"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/app"]
